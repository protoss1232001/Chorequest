<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover lets the app paint under the notch and home indicator -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>ChoreQuest — Chores, Points &amp; Rewards</title>
  <meta name="description" content="A family chore list where kids earn points that keep adding up across the week, month and year — then choose their own reward from a store their parent stocks.">

  <!-- Home Screen / PWA -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ChoreQuest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192">
  <meta name="theme-color" content="#f6f6f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0b10" media="(prefers-color-scheme: dark)">

  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="app" class="app"></main>

  <!-- Overlays live outside #app so a re-render never tears them down mid-interaction -->
  <div id="sheet-host" class="sheet-host" aria-live="polite"></div>
  <div id="toast-host" class="toast-host" aria-live="polite"></div>
  <div id="confetti-host" class="confetti-host" aria-hidden="true"></div>

  <noscript>
    <p style="padding:2rem;font:16px/1.5 system-ui">ChoreQuest needs JavaScript switched on to run.</p>
  </noscript>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
